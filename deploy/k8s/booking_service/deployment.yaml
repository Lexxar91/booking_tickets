apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: booking-tickets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "Waiting for RabbitMQ..."; sleep 2; done;']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-booking 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      containers:
        - name: booking-service
          image: docker.io/library/booking_tickets-booking_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: booking-service-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: booking-postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: booking-postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: booking-postgres-db
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: jwt-public-key
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: rabbitmq-password
            - name: RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: booking-tickets-secrets
                  key: rabbitmq-vhost
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
