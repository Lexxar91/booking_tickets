apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-tickets-ingress
  namespace: booking-tickets
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - booking-tickets.local
      secretName: booking-tickets-tls
  rules:
    - host: booking-tickets.local  # локальный домен для разработки
      http:
        paths:
          # Все запросы к /events/* → event-service
          - path: /events(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: event-service
                port:
                  number: 8000

          # Все запросы к /auth/* → auth-service
          - path: /auth(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000

          # Все запросы к /bookings/* → booking-service
          - path: /bookings(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8000
