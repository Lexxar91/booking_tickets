apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-bff-ingress
  namespace: booking-tickets
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /bff/$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [booking-tickets.local]
      secretName: booking-tickets-tls
  rules:
    - host: booking-tickets.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8000
