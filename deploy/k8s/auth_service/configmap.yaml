apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: booking-tickets
data:
  APP_TITLE: "Auth Service"
  DEBUG: "false"
  SQL_ECHO: "false"
  ENVIRONMENT: "production"
  POSTGRES_SERVER: "postgres-auth"
  POSTGRES_PORT: "5432"
  ALGORITHM: "RS256"
  JWT_ISSUER: "booking-auth-service"
  BFF_ALLOWED_ORIGINS: '["https://booking-tickets.local"]'
  EVENT_SERVICE_URL: "http://event-service:8000"
  BOOKING_SERVICE_URL: "http://booking-service:8000"
