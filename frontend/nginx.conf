server {
    listen 80;
    server_name _;

    return 301 https://127.0.0.1:3443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls/tls.crt;
    ssl_certificate_key /run/secrets/tls/tls.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth_service:8000/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/events/ {
        proxy_pass http://event_service:8000/api/v1/events/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bookings/ {
        proxy_pass http://booking_service:8000/api/v1/bookings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/auth {
        proxy_pass http://auth_service:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health/events {
        proxy_pass http://event_service:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health/bookings {
        proxy_pass http://booking_service:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
