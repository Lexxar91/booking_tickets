apiVersion: 1

providers:
  - name: 'Booking Tickets Dashboards'
    orgId: 1
    folder: 'Booking Tickets'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards-json
      foldersFromFilesStructure: false
