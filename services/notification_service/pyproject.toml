[tool.poetry]
name = "notification-service"
version = "0.1.0"
description = "Notification Service для Booking_tickets"
authors = ["Dmitry"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
celery = {extras = ["rabbitmq"], version = "^5.6.3"}
kombu = "^5.6.2"
reportlab = "^4.4.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
