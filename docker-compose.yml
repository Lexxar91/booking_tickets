services:

  # ============================================================
  # EVENT SERVICE ИНФРАСТРУКТУРА
  # ============================================================

  postgres_event:
    image: postgres:16-alpine
    container_name: booking_postgres_event
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVENT_POSTGRES_DB}
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_POSTGRES_USER} -d ${EVENT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

  # ============================================================
  # AUTH SERVICE ИНФРАСТРУКТУРА
  # ============================================================

  postgres_auth:
    image: postgres:16-alpine
    container_name: booking_postgres_auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network


  # ============================================================
  # BOOKING SERVICE ИНФРАСТРУКТУРА
  # ============================================================
  postgres_booking:
    image: postgres:16-alpine
    container_name: booking_postgres_booking
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_POSTGRES_USER} -d ${BOOKING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: booking_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking_network
  
  # ============================================================
  # СЕРВИСЫ
  # ============================================================

  event_service:
    build:
      context: ./services/event_service
      dockerfile: Dockerfile
    container_name: booking_event_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVENT_POSTGRES_DB}
      POSTGRES_SERVER: postgres_event
      POSTGRES_PORT: 5432
      APP_TITLE: "Event Service"
      DEBUG: "false"
      SQL_ECHO: "false"
      ENVIRONMENT: "production"
      JWT_ISSUER: "booking-auth-service"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/public.pem"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      postgres_event:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network

  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: booking_auth_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_SERVER: postgres_auth
      POSTGRES_PORT: 5432
      APP_TITLE: "Auth Service"
      DEBUG: "false"
      SQL_ECHO: "false"
      ENVIRONMENT: "production"
      JWT_ISSUER: "booking-auth-service"
      JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt/private.pem"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/public.pem"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      postgres_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network
  

  booking_service:
    build:
      context: ./services/booking_service
      dockerfile: Dockerfile
    container_name: booking_booking_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
      POSTGRES_SERVER: postgres_booking
      POSTGRES_PORT: 5432
      APP_TITLE: "Booking Service"
      DEBUG: "false"
      SQL_ECHO: "false"
      ENVIRONMENT: "production"
      JWT_ISSUER: "booking-auth-service"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/public.pem"
      EVENT_SERVICE_URL: "http://event_service:8000"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      postgres_booking:
        condition: service_healthy
      event_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network

  notification_worker:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    container_name: booking_notification_worker
    restart: unless-stopped
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Команда запуска воркера
    # --loglevel=info — показывать все логи
    # --concurrency=2 — два параллельных воркера
    # concurrency = количество CPU ядер
    command: celery -A src.worker worker --loglevel=info --concurrency=2
    networks:
      - booking_network

volumes:
  postgres_event_data:
  postgres_auth_data:
  postgres_booking_data:
  rabbitmq_data:

networks:
  booking_network:
    name: booking_tickets_booking_network 
