services:

  # ============================================================
  # EVENT SERVICE ИНФРАСТРУКТУРА
  # ============================================================

  postgres_event:
    image: postgres:16-alpine
    container_name: booking_postgres_event
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVENT_POSTGRES_DB}
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_POSTGRES_USER} -d ${EVENT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

  # ============================================================
  # AUTH SERVICE ИНФРАСТРУКТУРА
  # ============================================================

  postgres_auth:
    image: postgres:16-alpine
    container_name: booking_postgres_auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network


  # ============================================================
  # BOOKING SERVICE ИНФРАСТРУКТУРА
  # ============================================================
  postgres_booking:
    image: postgres:16-alpine
    container_name: booking_postgres_booking
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_POSTGRES_USER} -d ${BOOKING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network
  # ============================================================
  # СЕРВИСЫ
  # ============================================================

  event_service:
    build:
      context: ./services/event_service
      dockerfile: Dockerfile
    container_name: booking_event_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVENT_POSTGRES_DB}
      POSTGRES_SERVER: postgres_event
      POSTGRES_PORT: 5432
      APP_TITLE: "Event Service"
      DEBUG: "true"
    ports:
      - "8001:8000"
    depends_on:
      postgres_event:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network

  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: booking_auth_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_SERVER: postgres_auth
      POSTGRES_PORT: 5432
      APP_TITLE: "Auth Service"
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8002:8000"
    depends_on:
      postgres_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network
  

  booking_service:
    build:
      context: ./services/booking_service
      dockerfile: Dockerfile
    container_name: booking_booking_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
      POSTGRES_SERVER: postgres_booking
      POSTGRES_PORT: 5432
      APP_TITLE: "Booking Service"
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY}
      EVENT_SERVICE_URL: "http://event_service:8000"
    ports:
      - "8003:8000"
    depends_on:
      postgres_booking:
        condition: service_healthy
      event_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking_network

volumes:
  postgres_event_data:
  postgres_auth_data:
  postgres_booking_data:

networks:
  booking_network:
    driver: bridge