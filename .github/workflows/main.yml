name: Booking Tickets workflow

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Setup up python
      uses: actions/setup-python@v5

      with:
        python-version: 3.12

    - name: Install linters
      run: |
        python -m pip install --upgrade pip 
        pip install flake8==7.3.0 flake8-isort==7.0.0

    - name: Test with flake8
      run: >
        python -m flake8
        services/auth_service/src
        services/booking_service/src
        services/event_service/src
        services/notification_service/src
    
  tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth_service
          - booking_service
          - event_service
          - notification_service
      
    defaults:
      run:
        working-directory: services/${{matrix.service}}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            services/${{ matrix.service }}/.venv
          key: poetry-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/poetry.lock', matrix.service)) }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.service }}-

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest

      
          



